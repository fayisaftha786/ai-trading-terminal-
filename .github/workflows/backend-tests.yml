name: Backend tests

on:
  pull_request:
    branches: [main]
    paths:
      - "app/**"
      - "tests/**"
      - "requirements.txt"
      - "static/**"
      - "scripts/master_release.py"
      - ".github/workflows/backend-tests.yml"
  push:
    branches: [main]
    paths:
      - "app/**"
      - "tests/**"
      - "requirements.txt"
      - "static/**"
      - "scripts/master_release.py"
      - ".github/workflows/backend-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Run backend test suite
        run: python -m pytest -q
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
      - name: Check dashboard JavaScript syntax
        run: node --check static/app.js
      - name: Run full release verification gate
        run: python scripts/master_release.py
