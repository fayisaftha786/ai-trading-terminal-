name: AI Trading Terminal v0.5.0 — Cloud source verification and Android APK

on:
  push:
    paths:
      - "AITradingTerminal-v0.5.0-No-Termux-Cloud-Source.zip"
      - ".github/workflows/cloud-apk.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: att-v050-cloud-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout delivery repository
        uses: actions/checkout@v7

      - name: Verify exact release source archive
        shell: bash
        run: |
          set -euo pipefail
          FILE="AITradingTerminal-v0.5.0-No-Termux-Cloud-Source.zip"
          test -s "$FILE" || { echo "Upload the v0.5.0 source ZIP to the repository root first."; exit 2; }
          echo "Uploaded archive SHA-256:"
          sha256sum "$FILE"
          unzip -tq "$FILE"
          echo "ZIP integrity: PASS"

      - name: Extract project
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "${RUNNER_TEMP}/att-source"
          unzip -q "AITradingTerminal-v0.5.0-No-Termux-Cloud-Source.zip" -d "${RUNNER_TEMP}/att-source"
          test -d "${RUNNER_TEMP}/att-source/ai-trading-terminal"
          if [ -f README.md ]; then cp README.md DELIVERY-README.md; fi
          cp -a "${RUNNER_TEMP}/att-source/ai-trading-terminal/." "${GITHUB_WORKSPACE}/"
          # Keep this delivery workflow under its existing GitHub App authorization.
          rm -f .github/workflows/ci.yml
          test -f requirements.txt
          test -f build-android-debug.sh

      - name: Publish verified project source to main for hosting
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "Publish verified AI Trading Terminal v0.5.0 source"
            git push origin HEAD:main
          fi

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Install backend dependencies
        run: python -m pip install -r requirements.txt

      - name: Run full release gate
        run: python scripts/master_release.py

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v4
        with:
          accept-android-sdk-licenses: "yes"

      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "8.9"
          cache-provider: basic

      - name: Install Android SDK platform and build tools
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Build and verify APK signature and metadata
        run: ./build-android-debug.sh

      - name: Upload installable debug APK and verification files
        uses: actions/upload-artifact@v7
        with:
          name: AITradingTerminal-Android-v0.5.0-debug-apk
          path: |
            dist/AITradingTerminal-Android-v0.5.0-debug.apk
            dist/AITradingTerminal-Android-v0.5.0-debug.apk.sha256
            dist/AITradingTerminal-Android-v0.5.0-build-info.txt
          if-no-files-found: error
          retention-days: 30
