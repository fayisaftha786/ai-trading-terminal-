name: AI Trading Terminal v0.5.0 — Cloud source verification and Android APK

on:
  push:
    paths:
      - "android/**"
      - "build-android-debug.sh"
      - ".github/workflows/cloud-apk.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: att-v050-cloud-apk-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout delivery repository
        uses: actions/checkout@v7

      - name: Verify current repository Android source
        shell: bash
        run: |
          set -euo pipefail
          test -s android/settings.gradle.kts
          test -s android/app/build.gradle.kts
          test -s android/app/src/main/AndroidManifest.xml
          test -s build-android-debug.sh
          echo "Current checked-out Android source: PASS"

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Install backend dependencies
        run: python -m pip install -r requirements.txt

      - name: Run full release gate
        run: python scripts/master_release.py

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v4
        with:
          accept-android-sdk-licenses: true

      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "8.9"
          cache-provider: basic

      - name: Install Android SDK platform and build tools
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Build and verify APK signature and metadata
        run: ./build-android-debug.sh

      - name: Upload installable debug APK and verification files
        uses: actions/upload-artifact@v7
        with:
          name: AITradingTerminal-Android-v0.5.0-debug-apk
          path: |
            dist/AITradingTerminal-Android-v0.5.0-debug.apk
            dist/AITradingTerminal-Android-v0.5.0-debug.apk.sha256
            dist/AITradingTerminal-Android-v0.5.0-build-info.txt
          if-no-files-found: error
          retention-days: 30

      - name: Publish direct APK download on GitHub Releases
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="v0.5.0-debug"
          APK="dist/AITradingTerminal-Android-v0.5.0-debug.apk"
          CHECKSUM="dist/AITradingTerminal-Android-v0.5.0-debug.apk.sha256"
          BUILD_INFO="dist/AITradingTerminal-Android-v0.5.0-build-info.txt"
          test -s "$APK"
          test -s "$CHECKSUM"
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" "$APK" "$CHECKSUM" "$BUILD_INFO" --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$TAG" "$APK" "$CHECKSUM" "$BUILD_INFO" \
              --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" \
              --title "AI Trading Terminal v0.5.0 Debug APK" \
              --notes "Installable Android debug/test client. This is not a production-signed release. The app needs a separately deployed HTTPS backend URL to load the trading dashboard. Live-money trading is not enabled."
          fi
