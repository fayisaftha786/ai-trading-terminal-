name: Production PAPER Worker watchdog

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-paper-worker-watchdog
  cancel-in-progress: false

jobs:
  health:
    name: Verify production Worker and scheduled PAPER heartbeat
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - name: Checkout production source
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Check public health and scheduler heartbeat
        shell: bash
        env:
          WORKER_HEALTH_URL: https://ai-trading-terminal.fayisaftha786.workers.dev/api/health
        run: |
          set -euo pipefail
          health_file="$(mktemp)"
          trap 'rm -f "$health_file"' EXIT

          expected_main_sha="$(curl --fail --silent --show-error --max-time 15 https://api.github.com/repos/fayisaftha786/ai-trading-terminal-/commits/main | node -e '
            let raw = "";
            process.stdin.setEncoding("utf8");
            process.stdin.on("data", chunk => { raw += chunk; });
            process.stdin.on("end", () => {
              try {
                const commit = JSON.parse(raw);
                if (!/^[0-9a-f]{40}$/.test(commit.sha || "")) throw new Error("main commit SHA unavailable");
                process.stdout.write(commit.sha);
              } catch (error) {
                console.error(error.message);
                process.exitCode = 1;
              }
            });
          ')"
          test -n "$expected_main_sha" || { echo "::error::Could not resolve current main commit SHA."; exit 1; }
          printf 'Expected main commit: %s\n' "$expected_main_sha"

          for attempt in $(seq 1 12); do
            response="$(curl --fail --silent --show-error --max-time 15 "$WORKER_HEALTH_URL" 2>/dev/null || true)"
            if [ -z "$response" ]; then
              echo "Health endpoint unavailable on attempt $attempt/12."
              verdict=2
            else
              printf '%s' "$response" > "$health_file"
              set +e
              node scripts/production-paper-watchdog-check.mjs "$health_file" "$expected_main_sha"
              verdict=$?
              set -e
            fi

            if [ "$verdict" -eq 0 ]; then
              echo "Production PAPER Worker and scheduled heartbeat verified."
              exit 0
            fi
            if [ "$verdict" -ne 2 ]; then
              echo "::error::Production PAPER watchdog detected a non-retryable health failure."
              exit 1
            fi
            if [ "$attempt" -lt 12 ]; then
              echo "Retryable health window; waiting 5 seconds before the next read-only check."
              sleep 5
            fi
          done

          echo "::error::Production health did not recover from the transient refresh window within 60 seconds."
          exit 1
