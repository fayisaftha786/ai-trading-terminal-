name: Free cloud market scanner

on:
  push:
    branches: [main]
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: free-cloud-market-scanner
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Run read-only market scan
        run: python scripts/cloud_market_scan.py
      - name: Upload market scan report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: market-scan-${{ github.run_id }}
          path: artifacts/
          if-no-files-found: warn
          retention-days: 30
