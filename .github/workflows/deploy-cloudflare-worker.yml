name: Deploy Cloudflare Worker

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloudflare-worker-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Validate and deploy production Worker
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"

      - name: Validate source
        run: npm run check

      - name: Run unit tests
        run: npm test

      - name: Build Worker dry run
        run: npm run build

      - name: Check deployment credentials are configured
        env:
          CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          test -n "$CF_API_TOKEN" || { echo "::error::Add CLOUDFLARE_API_TOKEN in GitHub Actions secrets."; exit 1; }
          test -n "$CF_ACCOUNT_ID" || { echo "::error::Add CLOUDFLARE_ACCOUNT_ID in GitHub Actions secrets."; exit 1; }

      - name: Deploy existing production Worker
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4"
          command: deploy --tag ${{ github.sha }} --var DEPLOY_COMMIT_SHA:${{ github.sha }} --message "Git commit ${{ github.sha }}"

      - name: Verify deployed Worker revision and PAPER-only safety
        env:
          WORKER_HEALTH_URL: https://ai-trading-terminal.fayisaftha786.workers.dev/api/health
          EXPECTED_DEPLOY_COMMIT_SHA: ${{ github.sha }}
        shell: bash
        run: |
          for attempt in $(seq 1 12); do
            response="$(curl --fail --silent --max-time 15 "$WORKER_HEALTH_URL" 2>/dev/null || true)"
            if [ -n "$response" ] && printf '%s' "$response" | node -e '
              let raw = "";
              process.stdin.setEncoding("utf8");
              process.stdin.on("data", (chunk) => { raw += chunk; });
              process.stdin.on("end", () => {
                try {
                  const health = JSON.parse(raw);
                  const checks = {
                    workerIdPresent: typeof health.worker_version?.id === "string" && health.worker_version.id.length > 0,
                    deploymentCommitMatches: health.deployment_commit_sha === process.env.EXPECTED_DEPLOY_COMMIT_SHA,
                    statusOk: health.status === "ok",
                    paperOnly: health.mode === "paper_only",
                    liveTradingDisabled: health.live_trading_enabled === false,
                    binanceTestnetDisabled: health.binance_testnet_enabled === false
                  };
                  if (Object.values(checks).every(Boolean)) {
                    console.log("Deployed Worker revision and PAPER-only safety verified.");
                    return;
                  }
                  console.error("Worker health checks did not pass:", JSON.stringify(checks));
                  process.exitCode = 1;
                } catch (error) {
                  console.error("Worker health endpoint returned invalid JSON:", error.message);
                  process.exitCode = 1;
                }
              });
            '; then
              exit 0
            fi
            echo "Deployment health check attempt $attempt/12 did not match the expected revision; retrying."
            sleep 10
          done
          echo "::error::Production Worker did not report the expected commit SHA and PAPER-only safety flags."
          exit 1
