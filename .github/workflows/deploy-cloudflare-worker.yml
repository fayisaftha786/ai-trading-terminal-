name: Deploy Cloudflare Worker

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloudflare-worker-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Validate and deploy production Worker
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"

      - name: Validate source
        run: npm run check

      - name: Run unit tests
        run: npm test

      - name: Build Worker dry run
        run: npm run build

      - name: Check deployment credentials are configured
        env:
          CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          test -n "$CF_API_TOKEN" || { echo "::error::Add CLOUDFLARE_API_TOKEN in GitHub Actions secrets."; exit 1; }
          test -n "$CF_ACCOUNT_ID" || { echo "::error::Add CLOUDFLARE_ACCOUNT_ID in GitHub Actions secrets."; exit 1; }

      - name: Deploy existing production Worker
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4"
          command: deploy --tag ${{ github.sha }} --var DEPLOY_COMMIT_SHA:${{ github.sha }} --message "Git commit ${{ github.sha }}"

      - name: Capture production login throttle runtime diagnostics
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          WORKER_URL: https://ai-trading-terminal.fayisaftha786.workers.dev
        shell: bash
        run: |
          set +e
          timeout --signal=INT 24s npx --yes wrangler@4 tail ai-trading-terminal --format=json > /tmp/worker-tail.jsonl 2>&1 &
          tail_pid=$!
          sleep 6
          login_status="$(curl --silent --show-error --max-time 15 -o /tmp/login-probe.json -w '%{http_code}' -X POST "${WORKER_URL}/api/auth/login" -H 'content-type: application/json' --data '{"username":"__diagnostic_invalid_user__","password":"FakeOnly-NotARealPassword-2026!"}' 2>/dev/null)"
          health_status="$(curl --silent --show-error --max-time 15 -o /tmp/health-probe.json -w '%{http_code}' "${WORKER_URL}/api/health?runtime_probe=${GITHUB_SHA}" 2>/dev/null)"
          echo "DIAGNOSTIC_LOGIN_HTTP_STATUS=${login_status:-request_failed}"
          cat /tmp/login-probe.json 2>/dev/null || true
          echo
          echo "DIAGNOSTIC_HEALTH_HTTP_STATUS=${health_status:-request_failed}"
          cat /tmp/health-probe.json 2>/dev/null || true
          echo
          sleep 4
          kill -INT "$tail_pid" 2>/dev/null || true
          wait "$tail_pid" 2>/dev/null || true
          echo "CLOUDFLARE_RUNTIME_TAIL_BEGIN"
          cat /tmp/worker-tail.jsonl 2>/dev/null || true
          echo "CLOUDFLARE_RUNTIME_TAIL_END"
          exit 0

      - name: Verify deployed Worker revision and PAPER-only safety
        env:
          WORKER_HEALTH_URL: https://ai-trading-terminal.fayisaftha786.workers.dev/api/worker/health
          EXPECTED_DEPLOY_COMMIT_SHA: ${{ github.sha }}
        shell: bash
        run: |
          for attempt in $(seq 1 12); do
            response="$(curl --fail --silent --max-time 15 "${WORKER_HEALTH_URL}?deploy_verify=${GITHUB_SHA}-${attempt}" 2>/dev/null || true)"
            if [ -n "$response" ] && printf '%s' "$response" | node -e '
              let raw = "";
              process.stdin.setEncoding("utf8");
              process.stdin.on("data", (chunk) => { raw += chunk; });
              process.stdin.on("end", () => {
                try {
                  const health = JSON.parse(raw);
                  const checks = {
                    workerIdPresent: typeof health.worker_version?.id === "string" && health.worker_version.id.length > 0,
                    deploymentCommitMatches: health.deployment_commit_sha === process.env.EXPECTED_DEPLOY_COMMIT_SHA,
                    statusOk: health.status === "ok",
                    paperOnly: health.mode === "paper_only",
                    liveTradingDisabled: health.live_trading_enabled === false,
                  };
                  console.log("Deployment verification:", JSON.stringify({ checks, deployment_commit_sha: health.deployment_commit_sha, worker_version: health.worker_version }));
                  if (Object.values(checks).every(Boolean)) {
                    console.log("Deployed Worker revision and PAPER-only safety verified.");
                    return;
                  }
                  console.error("Worker health checks did not pass:", JSON.stringify(checks));
                  process.exitCode = 1;
                } catch (error) {
                  console.error("Worker health endpoint returned invalid JSON:", error.message);
                  process.exitCode = 1;
                }
              });
            '; then
              exit 0
            fi
            echo "Deployment health check attempt $attempt/12 did not match the expected revision; retrying."
            sleep 10
          done
          echo "::error::Production Worker did not report the expected commit SHA and PAPER-only safety flags."
          exit 1

      - name: Verify production revision remains stable after Cloudflare build hooks
        env:
          WORKER_HEALTH_URL: https://ai-trading-terminal.fayisaftha786.workers.dev/api/worker/health
          EXPECTED_DEPLOY_COMMIT_SHA: ${{ github.sha }}
        shell: bash
        run: |
          # Recheck after Git-connected provider build hooks have had time to publish.
          sleep 120
          response="$(curl --fail --silent --max-time 15 "${WORKER_HEALTH_URL}?deploy_stability=${GITHUB_SHA}" 2>/dev/null || true)"
          if [ -z "$response" ]; then
            echo "::error::Production Worker did not return health JSON during the stability check."
            exit 1
          fi
          printf '%s' "$response" | node -e '
            let raw = "";
            process.stdin.setEncoding("utf8");
            process.stdin.on("data", (chunk) => { raw += chunk; });
            process.stdin.on("end", () => {
              try {
                const health = JSON.parse(raw);
                const checks = {
                  deploymentCommitMatches: health.deployment_commit_sha === process.env.EXPECTED_DEPLOY_COMMIT_SHA,
                  provenanceVerified: health.deployment_provenance_status === "verified",
                  statusOk: health.status === "ok",
                  paperOnly: health.mode === "paper_only",
                  liveTradingDisabled: health.live_trading_enabled === false,
                };
                console.log("Stable deployment verification:", JSON.stringify({
                  checks,
                  deployment_commit_sha: health.deployment_commit_sha,
                  deployment_provenance_status: health.deployment_provenance_status,
                  worker_version: health.worker_version
                }));
                if (Object.values(checks).every(Boolean)) return;
                console.error("Production revision changed or lost deployment provenance after initial verification.");
                process.exitCode = 1;
              } catch (error) {
                console.error("Stable deployment health response was invalid:", error.message);
                process.exitCode = 1;
              }
            });
          '
